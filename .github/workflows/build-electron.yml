name: Build Electron (Scola)

on:
  workflow_dispatch: {}
  # Une fois que ça tourne bien, tu peux ajouter :
  # push:
  #   branches: [main]
  #   paths: ["electron/**", ".github/workflows/build-electron.yml"]

permissions:
  contents: read

concurrency:
  group: build-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Export web bundle
        run: npx expo export --platform web
        env:
          PAPILLON_TARGET: electron

      - name: Install Electron app dependencies
        working-directory: electron
        run: npm install

      - name: Write Google Geolocation API key
        working-directory: electron
        shell: bash
        env:
          GOOGLE_GEOLOCATION_API_KEY: ${{ secrets.GOOGLE_GEOLOCATION_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('real-keys.json', JSON.stringify({googleApiKey: process.env.GOOGLE_GEOLOCATION_API_KEY || ''}))"

      - name: Build Windows installer
        working-directory: electron
        run: npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scola-Windows
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
