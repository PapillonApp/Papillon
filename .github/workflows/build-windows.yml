name: Build desktop (Windows)

# Se déclenche automatiquement sur push vers main/master, et manuellement
# depuis l'onglet "Actions" de GitHub (bouton "Run workflow") — c'est ça,
# concrètement, "builder sur GitHub" : pas besoin de Rust/Node en local.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (accélère les builds suivants)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Build .exe (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pas de tagName/releaseId fourni : tauri-action se contente de
        # builder et de laisser les artefacts sur le runner, sans essayer de
        # créer/publier une release GitHub.

      - name: Publier le build comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: papillon-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 30
