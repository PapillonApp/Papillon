name: Build Scola (Tauri)

on:
  workflow_dispatch: {}
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install app dependencies
        run: npm install --legacy-peer-deps

      - name: Export web bundle
        run: npx expo export --platform web
        env:
          PAPILLON_TARGET: electron

      - name: Check source for unsafe web ExpoUI imports
        run: npm run check:web-native-imports

      - name: Check Web animations for unsupported springify usage
        run: npm run check:web-animations

      - name: Check exported web bundle for ExpoUI native module
        run: node scripts/check-web-bundle.js

      - name: Build Scola
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scola-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
