[package]
name = "papillon"
version = "0.1.0"
description = "Papillon — client de vie scolaire (build desktop)"
authors = ["PapillonApp"]
license = "GPL-3.0"
repository = "https://github.com/PapillonApp/Papillon"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "papillon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2.6.0", features = ["unsafe-headers"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-autostart = "2.5.1"

# Build "release" optimisé (taille + vitesse) plutôt que les réglages par
# défaut de Cargo — cohérent avec le "opti" demandé.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
