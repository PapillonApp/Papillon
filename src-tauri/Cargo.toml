[package]
name = "scola"
version = "1.0.0"
description = "Scola — la version PC de Papillon"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-http = { version = "2.6", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "scola"
path = "src/main.rs"
